scenario_id: unknown_code_E999
description: >
  GEAR-02 has reported error code E-999, which does not exist in any document in the
  corpus. Sensor readings are near nominal with no significant deviations. This scenario
  is designed to verify that the system correctly refuses to produce a procedural response
  when the error code cannot be matched to any known fault in the corpus. The system must
  NOT invent a meaning for E-999 or produce any maintenance procedure. It must return
  a structured refusal with escalation guidance.

